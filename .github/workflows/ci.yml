name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest   # Docker is available here for Testcontainers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # same SDK (and analyzers) as local builds

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive | tee vulnerable.txt && ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  bicep:
    runs-on: ubuntu-latest   # az CLI is preinstalled; no Azure login: build and lint are offline
    steps:
      - uses: actions/checkout@v4

      # Same Bicep version as the local lint (azd downloaded 0.47.16), so a new linter rule cannot turn CI red on an
      # unchanged branch; bump it on purpose, like global.json.
      - name: Pin Bicep
        run: az bicep install --version v0.47.16

      # Lint compiles the files and checks types and linter rules; warnings do not change its exit code, so grep for them.
      - name: Bicep lint (fail on any warning)
        run: |
          set -o pipefail
          az bicep version
          az bicep lint --file infra/main.bicep 2>&1 | tee lint.txt
          ! grep -E ': (Warning|Error) ' lint.txt
